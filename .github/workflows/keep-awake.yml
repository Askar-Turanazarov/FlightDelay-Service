name: Keep demo awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --prefix .github/scripts playwright@1.49.1
          npx --prefix .github/scripts playwright install --with-deps chromium
      - name: Visit the demo
        run: node .github/scripts/keep_awake.mjs
      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep-awake-failure.png
          if-no-files-found: ignore
